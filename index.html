<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>ParkPath Maps MVP</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app">
    <div id="map" aria-label="Mapa interativo"></div>

    <header class="topbar">
      <div class="brand">ParkPath</div>
      <div id="placeBadge" class="place-badge" title="Localização atual">
        <span class="place-dot"></span>
        <span id="placeName">Localizando…</span>
      </div>
    </header>

    <section id="gpsCard" class="gps-card">
      <div><strong id="gpsState">Buscando GPS…</strong></div>
      <div class="gps-meta">
        <span id="accuracyText">Precisão: —</span>
        <span id="speedText">Velocidade: —</span>
      </div>
    </section>

    <div class="controls">
      <button id="followBtn" class="map-btn active" aria-pressed="true" title="Seguir minha localização">◎</button>
      <button id="locateBtn" class="map-btn" title="Centralizar em mim">⌖</button>
    </div>

    <div id="permissionPanel" class="permission-panel hidden">
      <h1>Ativar localização</h1>
      <p>O ParkPath usa sua localização enquanto esta página estiver aberta para acompanhar seu movimento no mapa.</p>
      <button id="retryBtn">Usar minha localização</button>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./app.js"></script>
</body>
</html>
